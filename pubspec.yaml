name: apapane
description: Apapane story generation app.
publish_to: 'none'
version: 0.1.44+66

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  audioplayers: ^6.0.0
  cached_network_image: ^3.3.1
  cloud_firestore: ^5.6.1
  cloud_functions: ^5.2.0
  freezed: ^2.4.6
  freezed_annotation: ^2.4.1
  firebase_analytics: ^11.4.0
  firebase_auth: ^5.4.0
  firebase_core: ^3.10.0
  firebase_crashlytics: ^4.3.0
  firebase_storage: ^12.4.0
  persistent_bottom_nav_bar: ^5.0.2
  flutter_tts: ^4.0.2
  shared_preferences: ^2.2.3
  path_provider: ^2.1.5
  flutter_dotenv: ^5.1.0
  intl: any
  image_picker: ^1.2.1
  bordered_text: ^2.0.0
  flutter_screenutil: ^5.3.1
  flutter_riverpod: ^2.4.9
  google_sign_in: ^6.2.1
  google_fonts: ^6.2.1
  pull_to_refresh: ^2.0.0
  url_launcher: ^6.3.2
  clipboard: ^0.1.3
  flash: ^3.1.0
  uuid: ^4.4.0
  flutter_svg: ^2.0.10+1
  fluttertoast: ^9.0.0
  material_floating_search_bar: ^0.3.7
  json_serializable: ^6.7.1
  http: ^1.0.0
  speech_to_text: ^7.3.0
  avatar_glow: ^3.0.1
  get: ^4.6.5
  flutter_chat_ui: ^1.6.13
  image_cropper: ^11.0.0
  flutter_chat_types: ^3.6.2
  in_app_purchase: ^3.2.3
  in_app_purchase_android: ^0.4.0+5
  in_app_purchase_storekit: ^0.4.4
  package_info_plus: ^8.0.0
  go_router: ^14.2.0
  firebase_app_check: ^0.3.2+10



dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.7
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

dependency_overrides:
  flutter_plugin_android_lifecycle: ^2.0.33
  path_provider_android:
    path: third_party/patched_packages/path_provider_android
  shared_preferences_android:
    path: third_party/patched_packages/shared_preferences_android
  url_launcher_android:
    path: third_party/patched_packages/url_launcher_android
  url_launcher_ios:
    path: third_party/patched_packages/url_launcher_ios
  win32: ^5.15.0


flutter:
  uses-material-design: true

  assets:
    - .env.example
    - assets/images/apapane_icon_1.png
    - assets/images/end_story_image.png
    - assets/images/home_image.png
    - assets/images/archive_my_story.png
    - assets/images/circle_indicator_image.png
    - assets/images/public_stories_image.png
    #profileImages
    - assets/images/fairy.png
    - assets/images/dragon_boy.png
    - assets/images/girl_rabbit.png
    - assets/images/ninja.png
    - assets/images/pirates.png
    - assets/images/venture.png
    - assets/images/volt_boy.png
    #titlePictures
    - assets/images/arupaka.png
    - assets/images/pirate.png
    - assets/images/boy.png
    - assets/images/dragon.png
    - assets/images/dream.png
    - assets/images/rupan.png
    - assets/images/girl.png
    - assets/images/pretty_girl.png
    - assets/images/dog.png
    - assets/images/apapane_knight.png
    - assets/images/judge_background.jpeg
    - assets/images/update_profile_image.png
    - assets/images/premium.PNG
    - assets/images/kohaku.png

    #削除
    - assets/a.json

flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  adaptive_icon_background: "#FFF4DD"
  adaptive_icon_foreground: "assets/images/app_icon_foreground.png"
  min_sdk_android: 21
  remove_alpha_ios: true

  fonts:
    - family: ZenMaruGothic
      fonts:
        - asset: fonts/Zen_Maru_Gothic/ZenMaruGothic-Regular.ttf
