name: Deploy Internal

on:
  push:
    branches:
      - master
      - main
      - codex/ios-actions-check
  workflow_dispatch:
    inputs:
      deploy_android:
        description: Deploy Android to Google Play internal testing
        required: true
        default: true
        type: boolean
      deploy_ios:
        description: Deploy iOS to TestFlight internal testing
        required: true
        default: true
        type: boolean

concurrency:
  group: deploy-internal-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.32.5
  JAVA_VERSION: "17"
  RUBY_VERSION: "3.2"
  BUILD_NUMBER: ${{ github.run_number }}
  IOS_BUNDLE_ID: com.coroleai.apapane
  ANDROID_PACKAGE_NAME: com.coroleai.apapaneapp

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Run tests
        run: flutter test

  android_internal:
    name: Android Internal
    needs: validate
    if: >
      (github.event_name == 'push' &&
        (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')) ||
      github.event.inputs.deploy_android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Decode deployment files
        env:
          APP_DOTENV_BASE64: ${{ secrets.APP_DOTENV_BASE64 }}
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          Path(".env").write_bytes(base64.b64decode(os.environ["APP_DOTENV_BASE64"]))
          Path("android/app/upload-keystore.jks").write_bytes(
              base64.b64decode(os.environ["ANDROID_UPLOAD_KEYSTORE_BASE64"])
          )
          Path("android/play-service-account.json").write_text(
              os.environ["PLAY_SERVICE_ACCOUNT_JSON"],
              encoding="utf-8",
          )
          PY

      - name: Create key.properties
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          cat <<EOF > android/key.properties
          storePassword=${ANDROID_KEYSTORE_PASSWORD}
          keyPassword=${ANDROID_KEY_PASSWORD}
          keyAlias=${ANDROID_KEY_ALIAS}
          storeFile=app/upload-keystore.jks
          EOF

      - name: Build signed app bundle
        run: >
          flutter build appbundle
          --release
          --build-number "${BUILD_NUMBER}"
          --dart-define-from-file=.env

      - name: Upload to Google Play internal testing
        working-directory: android
        env:
          AAB_PATH: ${{ github.workspace }}/build/app/outputs/bundle/release/app-release.aab
          PLAY_SERVICE_ACCOUNT_JSON_PATH: ${{ github.workspace }}/android/play-service-account.json
        run: bundle exec fastlane internal

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-internal-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

  ios_testflight:
    name: iOS TestFlight
    needs: validate
    if: >
      (github.event_name == 'push' &&
        (github.ref == 'refs/heads/main' ||
         github.ref == 'refs/heads/master' ||
         github.ref == 'refs/heads/codex/ios-actions-check')) ||
      github.event.inputs.deploy_ios == 'true'
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Prepare match deploy key
        env:
          MATCH_GIT_PRIVATE_KEY_CONTENT: ${{ secrets.MATCH_GIT_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf "%s" "$MATCH_GIT_PRIVATE_KEY_CONTENT" > "${RUNNER_TEMP}/match_git_private_key"
          chmod 600 "${RUNNER_TEMP}/match_git_private_key"
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Configure Git identity for match
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Install CocoaPods dependencies
        working-directory: ios
        run: pod update

      - name: Decode deployment env file
        env:
          APP_DOTENV_BASE64: ${{ secrets.APP_DOTENV_BASE64 }}
        run: |
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          Path(".env").write_bytes(base64.b64decode(os.environ["APP_DOTENV_BASE64"]))
          env_values = {}
          for line in Path(".env").read_text(encoding="utf-8").splitlines():
              line = line.strip()
              if not line or line.startswith("#") or "=" not in line:
                  continue
              key, value = line.split("=", 1)
              env_values[key.strip()] = value.strip()
          Path("ios/Flutter/FirebaseConfig.xcconfig").write_text(
              "GOOGLE_IOS_URL_SCHEME="
              + env_values.get("GOOGLE_IOS_URL_SCHEME", "")
              + "\n",
              encoding="utf-8",
          )
          PY

      - name: Sync signing assets with match
        working-directory: ios
        env:
          APPSTORE_API_KEY_ID: ${{ vars.APPSTORE_API_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ vars.APPSTORE_ISSUER_ID }}
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          MATCH_GIT_PRIVATE_KEY: ${{ runner.temp }}/match_git_private_key
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_READONLY: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}
        run: bundle exec fastlane sync_signing

      - name: Build signed IPA
        run: >
          flutter build ipa
          --release
          --build-number "${BUILD_NUMBER}"
          --dart-define-from-file=.env
          --export-options-plist=ios/ExportOptions.plist

      - name: Locate IPA
        id: locate_ipa
        run: echo "path=$(find build/ios/ipa -maxdepth 1 -name '*.ipa' -print -quit)" >> "$GITHUB_OUTPUT"

      - name: Upload to TestFlight
        working-directory: ios
        env:
          APPSTORE_API_KEY_ID: ${{ vars.APPSTORE_API_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ vars.APPSTORE_ISSUER_ID }}
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        run: bundle exec fastlane upload_testflight ipa:"${{ steps.locate_ipa.outputs.path }}"

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-testflight-ipa
          path: ${{ steps.locate_ipa.outputs.path }}
          if-no-files-found: error
